[package]
name = "bevy_orzma_webview"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Forwarded by the binary's `debug` feature; enables bevy_cef's
# remote-debugging-port (Chromium DevTools / CDP on 127.0.0.1:9222).
debug = ["bevy_cef/debug"]

[dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_cef_core = { workspace = true }
orzma_vt = { path = "../orzma_vt/" }
bevy_orzmux = { path = "../bevy_orzmux" }
bevy_orzma_tty_renderer = { path = "../bevy_orzma_tty_renderer" }
orzma_webview_host = { path = "../orzma_webview_host" }
orzmux = { path = "../orzmux" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bevy_orzmux = { path = "../bevy_orzmux", features = ["test-support"] }
crossbeam-channel = "0.5"
tempfile = { workspace = true }

[lints]
workspace = true
