[package]
name = "bevy_orzma_webview"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Forwarded by the binary's `debug` feature; enables bevy_cef's
# remote-debugging-port (Chromium DevTools / CDP on 127.0.0.1:9222).
debug = ["bevy_cef/debug"]

[dependencies]
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_cef_core = { workspace = true }
orzma_vt = { path = "../orzma_vt/" }
bevy_orzma_mux = { path = "../bevy_orzma_mux" }
orzma_tty_renderer = { path = "../orzma_tty_renderer" }
orzma_webview_host = { path = "../webview_host", features = ["cef"] }
crossbeam-channel = "0.5"
data-encoding = "2"
getrandom = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
url = "2"
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


[dev-dependencies]
log = "0.4"
bevy_orzma_mux = { path = "../bevy_orzma_mux", features = ["test-support"] }
orzma_mux = { path = "../orzma_mux" }
tempfile = { workspace = true }

[lints]
workspace = true
