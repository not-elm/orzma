name: release-macos

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-macos"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Provision CEF + release render process
        run: just setup-cef-release

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build orzmd web assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Resolve version
        id: ver
        run: |
          CARGO_VERSION="$(cargo metadata --format-version 1 --no-deps | python3 -c '
          import json, sys
          pkgs = json.load(sys.stdin)["packages"]
          v = next((p["version"] for p in pkgs if p["name"] == "orzma"), None)
          if v is None:
              sys.exit("package orzma not found in cargo metadata")
          print(v)')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
              echo "Tag v${TAG_VERSION} does not match Cargo version ${CARGO_VERSION}; bump Cargo.toml or fix the tag." >&2
              exit 1
            fi
            VERSION="${TAG_VERSION}"
          else
            VERSION="${CARGO_VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build, sign, (notarize), package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_SIGN_IDENTITY" ]; then
            python3 scripts/bundle_macos.py --version "$VERSION" --notarize
          else
            python3 scripts/bundle_macos.py --version "$VERSION"
          fi

      # Uploaded on every run, so a manual dry run can be downloaded too; the draft job
      # in release.yml releases exactly these files.
      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: orzma-macos-${{ steps.ver.outputs.version }}
          retention-days: 7
          if-no-files-found: error
          overwrite: true
          path: target/bundle/orzma-${{ steps.ver.outputs.version }}-arm64.dmg
