name: ci-rust

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "sdk/ratatui_orzma/**"
      - "apps/*/src/**"
      - "apps/*/Cargo.toml"
      - "apps/*/build.rs"
      - "apps/*/tests/**"
      - "apps/*/benches/**"
      - "apps/*/examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".github/workflows/ci-rust.yml"
  pull_request:
    paths:
      - "src/**"
      - "crates/**"
      - "sdk/ratatui_orzma/**"
      - "apps/*/src/**"
      - "apps/*/Cargo.toml"
      - "apps/*/build.rs"
      - "apps/*/tests/**"
      - "apps/*/benches/**"
      - "apps/*/examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".github/workflows/ci-rust.yml"

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - if: runner.os == 'Windows'
        run: cmake --version; ninja --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/orzma/cef
          key: cef-${{ runner.os }}-149.3.0+149.0.6
      - if: runner.os == 'Windows'
        shell: pwsh
        run: '"CEF_PATH=$env:USERPROFILE\.cache\orzma\cef" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo clippy --workspace --exclude ratatui_orzma --exclude orzmd --exclude orzbrowser --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Trim debuginfo so the full workspace + CEF debug build fits the runner disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - if: runner.os == 'Windows'
        run: cmake --version; ninja --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/orzma/cef
          key: cef-${{ runner.os }}-149.3.0+149.0.6
      - if: runner.os == 'Windows'
        shell: pwsh
        run: '"CEF_PATH=$env:USERPROFILE\.cache\orzma\cef" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - if: runner.os == 'Linux'
        run: cargo test --workspace --tests -- --test-threads=1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\target\debug;$env:PATH"
          cargo test --workspace --exclude ratatui_orzma --exclude orzmd --exclude orzbrowser --tests -- --test-threads=1

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
      - run: cargo doc --workspace --no-deps

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
