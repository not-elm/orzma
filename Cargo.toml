[package]
name = "orzma"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "orzma"
path = "src/main.rs"

[features]
default = ["debug"]
debug = ["bevy_orzma_webview/debug"]

[dependencies]
ab_glyph = "0.2"
anyhow = { workspace = true }
arboard = { version = "3.6.1", default-features = false, features = [
  "wayland-data-control",
] }
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_cef_core = { workspace = true }
bevy_orzmux = { path = "crates/bevy_orzmux" }
bevy_orzma_tty_renderer = { path = "crates/bevy_orzma_tty_renderer" }
bevy_orzma_webview = { path = "crates/bevy_orzma_webview" }
orzma_webview_host = { path = "crates/orzma_webview_host" }
orzmux = { path = "crates/orzmux" }
orzma_tty = { path = "crates/orzma_tty" }
orzma_vt = { path = "crates/orzma_vt" }
crossbeam-channel = "0.5"
data-encoding = "2"
fontique = { version = "0.9", default-features = false, features = ["std"] }
getrandom = "0.2"
open = { workspace = true }
orzma_configs = { path = "crates/orzma_configs" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = "2"

[dev-dependencies]
bevy_orzmux = { path = "crates/bevy_orzmux", features = ["test-support"] }
orzmux = { path = "crates/orzmux", features = ["test-support"] }
tempfile = { workspace = true }

[build-dependencies]
embed-resource = "3"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
winit = "0.30"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[lints]
workspace = true

[workspace]
resolver = "2"
members = ["crates/*", "sdk/ratatui_orzma", "apps/orzmd", "apps/orzbrowser", "apps/cef_render_process"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["notelm"]
repository = "https://github.com/not-elm/orzma"
publish = false

[workspace.dependencies]
# NOTE: list individual features only: the bundles (`ui_api`, `2d_api`, `3d_api`, `common_api`, `*_bevy_render`)
# re-enable audio, glTF, animation, gizmos and the LUTs; PNG / HDR image loading is deliberately off.
bevy = { version = "0.19", default-features = false, features = [
  "default_app",
  "std",
  "multi_threaded",
  "bevy_winit",
  "bevy_window",
  "custom_cursor",
  "x11",
  "wayland",
  "webgl2",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_camera",
  "bevy_color",
  "bevy_image",
  "bevy_shader",
  "bevy_mesh",
  "bevy_material",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_input_focus",
  "bevy_text",
  "default_font",
  "system_font_discovery",
  "picking",
  "bevy_clipboard",
  "system_clipboard",
] }
anyhow = { version = "1" }
thiserror = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
portable-pty = "0.9"
tracing = "0.1"
tempfile = "3"
toml = "0.8"
dirs = "5"
unicode-width = "=0.2.0"
open = { version = "5", features = ["shellexecute-on-windows"] }
bevy_cef = "0.13"
bevy_cef_core = "0.13"
bitflags = "2"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
result_large_err = "allow"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
