[book]
title = "orzma"
description = "A terminal emulator that renders webviews inside the terminal."
authors = ["notelm"]

[build]
build-dir = "../../target/book"
create-missing = false
extra-watch-dirs = ["../../sdk/ratatui_orzma/examples"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
site-url = "/orzma/"
git-repository-url = "https://github.com/not-elm/orzma"
edit-url-template = "https://github.com/not-elm/orzma/edit/main/docs/book/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
no-section-label = true

# Old URLs and anchors of the published guide, sent to where their content
# lives now. Keys are site paths; a key with #fragment redirects one anchor.
[output.html.redirect]
"/multiplexer.html" = "panes-and-workspaces.html"
"/companion-apps.html#outline-panel" = "orzmd.html#outline-sidebar"
"/companion-apps.html#orzmd" = "orzmd.html"
"/companion-apps.html#features" = "orzmd.html#features"
"/companion-apps.html#usage" = "orzmd.html#usage"
"/companion-apps.html#keyboard-shortcuts" = "orzmd.html#keyboard-shortcuts"
"/companion-apps.html#reading" = "orzmd.html#reading"
"/companion-apps.html#outline-sidebar" = "orzmd.html#outline-sidebar"
"/companion-apps.html#search" = "orzmd.html#search"
"/companion-apps.html#orzbrowser" = "orzbrowser.html"
"/companion-apps.html#features-1" = "orzbrowser.html#features"
"/companion-apps.html#usage-1" = "orzbrowser.html#usage"
"/companion-apps.html#address-bar" = "orzbrowser.html#address-bar"
"/companion-apps.html#keyboard-shortcuts-1" = "orzbrowser.html#keyboard-shortcuts"
"/companion-apps.html#normal" = "orzbrowser.html#normal"
"/companion-apps.html#address-bar-1" = "orzbrowser.html#address-bar-1"
"/companion-apps.html#hint" = "orzbrowser.html#hint"
"/companion-apps.html#insert" = "orzbrowser.html#insert"
"/companion-apps.html#help" = "orzbrowser.html#help"
"/companion-apps.html#acknowledgements" = "orzbrowser.html#acknowledgements"
"/key-bindings.html#repeatable-bindings-leaderr" = "key-bindings.html#repeatable-bindings-r"
"/vi-mode.html#keys" = "key-bindings.html#vi-mode-keys-vi-mode"
"/getting-started.html" = "installation.html"
"/getting-started.html#install" = "installation.html"
"/introduction.html#supported-platforms" = "installation.html#supported-platforms"
"/introduction.html#install" = "installation.html"
"/introduction.html#macos" = "installation.html#macos"
"/introduction.html#first-launch" = "installation.html#first-launch"
"/introduction.html#windows" = "installation.html#windows"
"/introduction.html#linux" = "installation.html#linux"

[output.html.playground]
runnable = false
