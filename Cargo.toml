[package]
name = "orzma"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "orzma"
path = "src/main.rs"

[features]
default = ["debug"]
debug = ["bevy_orzma_webview/debug"]

[dependencies]
ab_glyph = "0.2"
anyhow = { workspace = true }
# Code-less dependency: orzma has no `use arboard` after the clipboard migration.
# It exists only so Cargo feature-unification keeps arboard's `wayland-data-control`
# (wl-clipboard-rs) enabled on the single arboard build that `bevy_clipboard` pulls in.
# Pin to match Bevy's arboard pin; if a future Bevy bump changes it, update this in lockstep.
arboard = { version = "3.6.1", default-features = false, features = [
  "wayland-data-control",
] }
bevy = { workspace = true }
bevy_cef = { workspace = true }
bevy_cef_core = { workspace = true }
bevy_orzmux = { path = "crates/bevy_orzmux" }
bevy_orzma_tty_renderer = { path = "crates/bevy_orzma_tty_renderer" }
bevy_orzma_webview = { path = "crates/bevy_orzma_webview" }
bevy_orzma_webview_host = { path = "crates/bevy_orzma_webview_host", features = ["cef"] }
orzmux = { path = "crates/orzmux" }
orzma_tty = { path = "crates/orzma_tty" }
orzma_vt = { path = "crates/orzma_vt" }
crossbeam-channel = "0.5"
data-encoding = "2"
fontique = { version = "0.9", default-features = false, features = ["std"] }
getrandom = "0.2"
open = { workspace = true }
orzma_configs = { path = "crates/orzma_configs" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = "2"

[dev-dependencies]
bevy_orzmux = { path = "crates/bevy_orzmux", features = ["test-support"] }
orzmux = { path = "crates/orzmux", features = ["test-support"] }
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
async-channel = "2"

[lints]
workspace = true

[workspace]
resolver = "2"
members = ["crates/*", "sdk/ratatui_orzma", "apps/orzmd", "apps/orzbrowser"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["notelm"]
repository = "https://github.com/not-elm/orzma"
publish = false

[workspace.dependencies]
# Bevy's `default` is `2d` + `3d` + `ui` + `audio`, and each of the first three
# pulls in `default_platform`, which pulls in `sysinfo_plugin`. That plugin makes
# `bevy_diagnostic` depend on `sysinfo` with `apple-app-store` on macOS, which
# enables `sysinfo/apple-sandbox` and replaces sysinfo's macOS process module
# with a stub whose `cwd()` and `parent()` always return `None`. Cargo unifies
# features per package, so any other crate here that reads a process working
# directory through sysinfo would silently get that stub. The groups are
# therefore expanded one level so `default_platform` can be taken without
# `sysinfo_plugin`. Re-check this list against bevy's own feature table on every
# bevy upgrade.
bevy = { version = "0.19", default-features = false, features = [
  # `2d` + `3d` + `ui` + `audio`, minus the `default_platform` they share.
  "default_app",
  "2d_bevy_render",
  "3d_bevy_render",
  "ui_api",
  "ui_bevy_render",
  "bevy_ui_widgets",
  "scene",
  "picking",
  "bevy_audio",
  "vorbis",
  # `default_platform`, minus `sysinfo_plugin`. `default_font` belongs to this
  # group; orzma also listed it explicitly before this expansion.
  "std",
  "bevy_gilrs",
  "bevy_winit",
  "bevy_clipboard",
  "default_font",
  "multi_threaded",
  "webgl2",
  "x11",
  "wayland",
  "custom_cursor",
  # orzma's own additions.
  "system_clipboard",
  "system_font_discovery",
] }
anyhow = { version = "1" }
thiserror = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
portable-pty = "0.9"
tracing = "0.1"
tempfile = "3"
toml = "0.8"
dirs = "5"
unicode-width = "=0.2.0"
open = "5"
bevy_cef = "0.12"
bevy_cef_core = "0.12"
bitflags = "2"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
result_large_err = "allow"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
