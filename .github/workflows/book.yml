name: book

on:
  pull_request:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LYCHEE_LINK_ARGS: >-
        --exclude-path '404\.html$'
        --remap 'https://github\.com/not-elm/orzma/(blob|tree|edit|raw)/(main|HEAD)/(.*) file://${{ github.workspace }}/$3'
        --remap 'https://raw\.githubusercontent\.com/not-elm/orzma/(main|HEAD)/(.*) file://${{ github.workspace }}/$2'
        --remap 'https://not-elm\.github\.io/orzma/?(.*) file://${{ github.workspace }}/target/book/$1'
        target/book README.md CONTRIBUTING.md apps/orzmd/README.md apps/orzbrowser/README.md sdk/ratatui_orzma/README.md sdk/orzma-web/README.md
    steps:
      - uses: actions/checkout@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Read the pinned book tool versions
        id: ver
        run: |
          echo "mdbook=$(just --evaluate mdbook_version)" >> "$GITHUB_OUTPUT"
          echo "mermaid=$(just --evaluate mdbook_mermaid_version)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@${{ steps.ver.outputs.mdbook }},mdbook-mermaid@${{ steps.ver.outputs.mermaid }}

      - name: Build the book
        shell: bash
        run: |
          just book 2>&1 | tee book.log
          if grep -q '^ERROR' book.log; then
            echo "mdBook logged an error; see the log above." >&2
            exit 1
          fi

      - name: Check that the HTML settings were applied
        run: grep -q '<base href="/orzma/">' target/book/404.html

      - name: Check links and anchors
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: --offline --include-fragments --no-progress ${{ env.LYCHEE_LINK_ARGS }}

      - name: Fail on repository links that no remap rule covers
        shell: bash
        run: |
          lychee --dump ${{ env.LYCHEE_LINK_ARGS }} > links.txt
          if grep -E '^https://(github\.com/not-elm/orzma/(blob|tree|edit|raw)/|raw\.githubusercontent\.com/not-elm/orzma/|not-elm\.github\.io/orzma)' links.txt; then
            echo "These links point into this repository or its site but match no --remap rule." >&2
            exit 1
          fi

      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}" >&2
            exit 1
          fi

      - name: Upload the book
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book

  deploy:
    name: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
